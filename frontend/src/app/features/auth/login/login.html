<app-auth-layout>
  <div class="rounded-card border border-slate-200 bg-white p-6 shadow-card sm:p-8">
    <header class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight text-slate-900">Sign in to your workspace</h1>
      <p class="mt-1 text-sm text-slate-500">
        Use the credentials you created with your organization.
      </p>
    </header>

    @if (errorMessage(); as message) {
      <div
        class="mb-5 flex items-start gap-2.5 rounded-lg border border-danger-600/20 bg-danger-50 px-3.5 py-3"
        role="alert"
      >
        <app-icon name="alert" class="mt-0.5 size-4 shrink-0 text-danger-700" />
        <p class="text-sm text-danger-800">{{ message }}</p>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
      <app-field
        label="Username"
        for="login-username"
        [error]="fieldError('username')"
        [required]="true"
      >
        <input
          id="login-username"
          type="text"
          formControlName="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="your.username"
          class="form-control"
          [class.form-control-invalid]="fieldError('username')"
          [attr.aria-invalid]="fieldError('username') ? 'true' : null"
          [attr.aria-describedby]="'login-username-description'"
        />
      </app-field>

      <app-field
        label="Password"
        for="login-password"
        [error]="fieldError('password')"
        [required]="true"
      >
        <div class="relative">
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="form-control pr-11"
            [class.form-control-invalid]="fieldError('password')"
            [attr.aria-invalid]="fieldError('password') ? 'true' : null"
            [attr.aria-describedby]="'login-password-description'"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 grid w-11 place-items-center text-slate-400 transition hover:text-slate-600"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >
            <app-icon [name]="showPassword() ? 'eyeOff' : 'eye'" class="size-4" />
          </button>
        </div>
      </app-field>

      <app-button type="submit" block size="lg" [loading]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </app-button>
    </form>
  </div>

  <p class="mt-6 text-center text-sm text-slate-600">
    New here?
    <a
      routerLink="/register"
      class="font-semibold text-brand-700 underline-offset-4 hover:underline"
    >
      Create an organization
    </a>
  </p>
</app-auth-layout>
